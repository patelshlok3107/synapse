services:
  - type: web
    name: synapse
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT interview_prep.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: synapse-redis
          type: redis
          property: connectionString

  - type: worker
    name: synapse-celery
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A interview_prep worker --loglevel=info"
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: synapse-redis
          type: redis
          property: connectionString

databases:
  - name: synapse-db
    databaseName: synapse
    user: synapse

  - name: synapse-redis
    type: redis
