{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="text-center mt-4 mb-4">
            <span class="eyebrow">Resume Analysis</span>
            <h2 class="page-title">Upload your <span class="cursive">resume</span></h2>
        </div>
        <div class="card p-4 p-md-5">
            <p class="text-secondary text-center mb-4">Upload your resume in PDF or DOCX format. Our AI will analyze it to generate tailored interview questions.</p>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 12px;">Upload and Parse</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
